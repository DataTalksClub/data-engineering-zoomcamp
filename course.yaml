description: |
  Data Engineering Zoomcamp is a free, intensive course that takes you from data engineering fundamentals to building production-grade data pipelines with industry-standard tools. No previous data engineering experience is required.

  The course runs for ten weeks: seven weeks of modules covering containerization and infrastructure as code, workflow orchestration, data warehousing, analytics engineering, batch processing, and streaming, followed by three weeks for a final project. Each module has video lectures, reading material, and a homework assignment.
outcome: Build production-grade data pipelines with industry-standard tools, starting from data engineering fundamentals.
starting_point: You are new to data engineering and want to understand how production data pipelines fit together.
prerequisites: You can write Python and SQL, use the command line, and have some Docker familiarity.
progression:
  - heading: I can write code, but the pipeline is still a black box
    description: I want to understand how data moves from a source into a dependable analytical system.
  - heading: I connect every stage of the data journey
    description: I practice ingestion, orchestration, warehousing, analytics engineering, batch processing, and streaming.
  - heading: I ship a production-grade data pipeline
    description: I bring the tools together in a final project that takes data from ingestion to useful output.
