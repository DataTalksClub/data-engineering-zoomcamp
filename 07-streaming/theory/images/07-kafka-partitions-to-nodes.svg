<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Kafka partitions to nodes</title>
  <desc id="desc">The Rides topic is divided into partitions distributed across separate Kafka nodes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-container" viewBox="0 0 24 24">
        <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M7 5v14M12 5v14M17 5v14" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="560" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(80 30)">
    <rect width="240" height="470" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Rides topic</text>
  </g>
  <path class="edge-boundary-halo" d="M300 130L620 130" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M300 130L620 130" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge-boundary-halo" d="M300 280L620 280" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M300 280L620 280" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge-boundary-halo" d="M300 430L620 430" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M300 430L620 430" stroke="#c2410c" marker-end="url(#arrow-amber)"/>

  <g class="node node-blue" transform="translate(100 90)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="100" y="32.76" font-size="16">Partition 1</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">ordered log</text>
  </g>
  <g class="node node-green" transform="translate(100 240)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="100" y="32.76" font-size="16">Partition 2</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">ordered log</text>
  </g>
  <g class="node node-amber" transform="translate(100 390)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="100" y="32.76" font-size="16">Partition 3</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">ordered log</text>
  </g>
  <g class="node node-blue" transform="translate(620 90)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-container" x="16" y="10" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="32.76" font-size="16">Kafka node 1</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">stores partition</text>
  </g>
  <g class="node node-green" transform="translate(620 240)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-container" x="16" y="10" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="32.76" font-size="16">Kafka node 2</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">stores partition</text>
  </g>
  <g class="node node-amber" transform="translate(620 390)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-container" x="16" y="10" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="32.76" font-size="16">Kafka node 3</text>
    <text class="node-subtitle" x="100" y="65" font-size="16">stores partition</text>
  </g>
</svg>
