<svg xmlns="http://www.w3.org/2000/svg" width="740" height="540" viewBox="0 0 740 540" role="img" aria-labelledby="title desc">
  <title id="title">Bruin command hierarchy</title>
  <desc id="desc">Bruin commands operate on a hierarchy from project to pipeline to assets and variables.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="740" height="540" fill="#ffffff"/>

  <path class="edge" d="M370 130L370 200" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M250 250H275V430H300" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M490 250H465V430H440" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(250 30)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-github" x="16" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Project</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">repository root</text>
  </g>
  <g class="node node-purple" transform="translate(250 200)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Pipeline</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">pipeline folder</text>
  </g>
  <g class="node node-green" transform="translate(60 380)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-document" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Assets</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">SQL · Python files</text>
  </g>
  <g class="node node-amber" transform="translate(440 380)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Variables</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">pipeline parameters</text>
  </g>
</svg>
