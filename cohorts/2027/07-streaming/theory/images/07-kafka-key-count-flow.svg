<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Streams key count flow</title>
  <desc id="desc">Kafka Streams groups records by key, counts each group, and emits keyed output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1240" height="560" fill="#ffffff"/>

  <path class="edge" d="M230 290L320 290" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M510 290H560V110H610" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M510 290L610 290" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M510 290H560V470H610" stroke="#c2410c" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M800 110H850V290H900" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M800 290L900 290" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M800 470H850V290H900" stroke="#c2410c" marker-end="url(#arrow-amber)"/>

  <g class="node node-blue" transform="translate(40 240)" filter="url(#shadow)">
    <rect width="190" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-message" x="16" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">Records</text>
    <text class="node-subtitle" x="95" y="75" font-size="16">keyed events</text>
  </g>
  <g class="node node-purple" transform="translate(320 240)" filter="url(#shadow)">
    <rect width="190" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">Group by key</text>
    <text class="node-subtitle" x="95" y="75" font-size="16">same key together</text>
  </g>
  <g class="node node-blue" transform="translate(610 70)" filter="url(#shadow)">
    <rect width="190" height="80" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="95" y="32.04" font-size="14">Key A</text>
    <text class="node-subtitle" x="95" y="65" font-size="16">3 events</text>
  </g>
  <g class="node node-green" transform="translate(610 250)" filter="url(#shadow)">
    <rect width="190" height="80" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="95" y="32.04" font-size="14">Key B</text>
    <text class="node-subtitle" x="95" y="65" font-size="16">2 events</text>
  </g>
  <g class="node node-amber" transform="translate(610 430)" filter="url(#shadow)">
    <rect width="190" height="80" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="95" y="32.04" font-size="14">Key C</text>
    <text class="node-subtitle" x="95" y="65" font-size="16">2 events</text>
  </g>
  <g class="node node-purple" transform="translate(900 240)" filter="url(#shadow)">
    <rect width="190" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">Count</text>
    <text class="node-subtitle" x="95" y="75" font-size="16">aggregate per key</text>
  </g>
</svg>
