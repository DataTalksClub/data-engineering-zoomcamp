<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">Stream join window</title>
  <desc id="desc">Two event streams produce join results inside a bounded join window.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-queue" viewBox="0 0 56 28">
        <path d="M5 8h46M5 20h46" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M5 8C.3 8 .3 20 5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="51" cy="14" rx="3.5" ry="6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1240" height="560" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(660 50)">
    <rect width="84" height="396" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Join window</text>
  </g>
  <path class="edge" d="M158.98 128H254.49V132H350" stroke="#64748b" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M394 132L680 132" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M394 132L680 132" stroke="#64748b" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M158.98 358H254.49V362H350" stroke="#64748b" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M394 362L680 362" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M394 362L680 362" stroke="#64748b" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M724 132H837V245H950" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M724 132H837V245H950" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge-boundary-halo" d="M724 362H837V245H950" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M724 362H837V245H950" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>

  <g class="node-icon-only node-blue" transform="translate(50 100)">
    <use href="#icon-queue" x="0" y="0" width="112" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="56" y="81">Stream A</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(50 330)">
    <use href="#icon-queue" x="0" y="0" width="112" height="56" color="#7c3aed"/>
    <text class="icon-node-title" x="56" y="81">Stream B</text>
  </g>
  <g class="node-icon-only node-gray" transform="translate(350 110)">
    <use href="#icon-message" x="0" y="0" width="44" height="44" color="#64748b"/>
  </g>
  <g class="node-icon-only node-gray" transform="translate(350 340)">
    <use href="#icon-message" x="0" y="0" width="44" height="44" color="#64748b"/>
  </g>
  <g class="node-icon-only node-blue" transform="translate(680 110)">
    <use href="#icon-message" x="0" y="0" width="44" height="44" color="#2563eb"/>
    <text class="icon-node-title" x="22" y="69">event A</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(680 340)">
    <use href="#icon-message" x="0" y="0" width="44" height="44" color="#7c3aed"/>
    <text class="icon-node-title" x="22" y="69">event B</text>
  </g>
  <g class="node node-green" transform="translate(950 200)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="16" y="15" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Joined pair</text>
    <text class="node-subtitle" x="100" y="70" font-size="16">emitted together</text>
  </g>
</svg>
