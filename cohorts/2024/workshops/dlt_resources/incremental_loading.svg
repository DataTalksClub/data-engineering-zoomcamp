<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Incremental loading decision tree</title>
  <desc id="desc">Write disposition depends on whether data is stateful and whether it can be requested incrementally.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="980" height="620" fill="#ffffff"/>

  <path class="edge" d="M190 140V190H190V240" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(190 190)">
    <rect x="-31" y="-16" width="62" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">no</text>
  </g>
  <path class="edge" d="M320 90H390V290H460" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(390 190)">
    <rect x="-31" y="-16" width="62" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">yes</text>
  </g>
  <path class="edge" d="M590 340V400H510V460" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(550 400)">
    <rect x="-31" y="-16" width="62" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">no</text>
  </g>
  <path class="edge" d="M720 290H700V510H680" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(700 400)">
    <rect x="-31" y="-16" width="62" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">yes</text>
  </g>

  <g class="node node-purple" transform="translate(60 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="130" y="40.96" font-size="11">Is it stateful data?</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">does it change over time?</text>
  </g>
  <g class="node node-green" transform="translate(60 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="40.96" font-size="11">Append</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">write disposition</text>
  </g>
  <g class="node node-purple" transform="translate(460 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="130" y="40.96" font-size="11">Can you request it incrementally?</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">e.g. by timestamp</text>
  </g>
  <g class="node node-green" transform="translate(380 460)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="40.96" font-size="11">Replace</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">write disposition</text>
  </g>
  <g class="node node-green" transform="translate(680 460)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="40.96" font-size="11">Merge (upsert)</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">write disposition</text>
  </g>
</svg>
