<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
  <title id="title">Dremel serving tree</title>
  <desc id="desc">The Dremel serving tree: a root server rewrites SELECT A, COUNT(B) as SELECT A, SUM(C) and distributes it through mixers to leaf nodes, which read column chunks from Colossus.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1040" height="820" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(80 590)">
    <rect width="880" height="180" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Colossus</text>
  </g>
  <path class="edge" d="M270 85L410 85" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M520 130V195H210V260" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M520 130L520 260" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M520 130V195H830V260" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M210 350L210 450" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M520 350L520 450" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M830 350L830 450" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M210 540L210 650" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M210 540L210 650" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M520 540L520 650" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M520 540L520 650" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M830 540L830 650" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M830 540L830 650" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-plain node-blue" transform="translate(40 50)">
    <text class="node-title" x="115" y="27" font-size="17">SELECT A, COUNT(B)</text>
    <text class="node-subtitle" x="115" y="50" font-size="16">FROM T GROUP BY A</text>
  </g>
  <g class="node node-amber" transform="translate(410 40)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-api" x="16" y="15" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="38.12" font-size="17">Root server</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">rewrites to SUM(C)</text>
  </g>
  <g class="node node-purple" transform="translate(100 260)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Mixer 11</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">intermediate server</text>
  </g>
  <g class="node node-purple" transform="translate(410 260)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Mixer 12</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">intermediate server</text>
  </g>
  <g class="node node-purple" transform="translate(720 260)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Mixer 13</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">intermediate server</text>
  </g>
  <g class="node node-blue" transform="translate(100 450)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Leaf node 21</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">reads column chunks</text>
  </g>
  <g class="node node-blue" transform="translate(410 450)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Leaf node 22</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">reads column chunks</text>
  </g>
  <g class="node node-blue" transform="translate(720 450)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Leaf node 23</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">reads column chunks</text>
  </g>
  <g class="node node-green" transform="translate(100 650)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Column chunks</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">tablet</text>
  </g>
  <g class="node node-green" transform="translate(410 650)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Column chunks</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">tablet</text>
  </g>
  <g class="node node-green" transform="translate(720 650)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="110" y="38.12" font-size="17">Column chunks</text>
    <text class="node-subtitle" x="110" y="70" font-size="16">tablet</text>
  </g>
</svg>
