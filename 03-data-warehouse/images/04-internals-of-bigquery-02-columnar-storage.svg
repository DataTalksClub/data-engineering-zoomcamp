<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Record-oriented vs column-oriented storage</title>
  <desc id="desc">Record-oriented storage keeps rows r1 and r2 together, like CSV; column-oriented storage keeps each column in its own place.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>

    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="840" height="360" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(70 100)">
    <rect width="310" height="190" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Record-oriented</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(470 100)">
    <rect width="310" height="190" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Column-oriented</text>
  </g>

  <g class="node node-plain node-blue" transform="translate(10 150)">
    <text class="node-title" x="20" y="27" font-size="8">r1</text>
  </g>
  <g class="node node-plain node-blue" transform="translate(10 210)">
    <text class="node-title" x="20" y="27" font-size="8">r2</text>
  </g>
  <g class="node node-blue" transform="translate(94 146)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="40" y="27" font-size="8">a1</text>
  </g>
  <g class="node node-green" transform="translate(186 146)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="40" y="27" font-size="8">b1</text>
  </g>
  <g class="node node-amber" transform="translate(278 146)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="40" y="27" font-size="8">c1</text>
  </g>
  <g class="node node-blue" transform="translate(94 206)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="40" y="27" font-size="8">a2</text>
  </g>
  <g class="node node-green" transform="translate(186 206)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="40" y="27" font-size="8">b2</text>
  </g>
  <g class="node node-amber" transform="translate(278 206)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="40" y="27" font-size="8">c2</text>
  </g>
  <g class="node node-plain node-blue" transform="translate(494 142)">
    <text class="node-title" x="40" y="27" font-size="8">A</text>
  </g>
  <g class="node node-plain node-green" transform="translate(586 142)">
    <text class="node-title" x="40" y="27" font-size="8">B</text>
  </g>
  <g class="node node-plain node-amber" transform="translate(678 142)">
    <text class="node-title" x="40" y="27" font-size="8">C</text>
  </g>
  <g class="node node-blue" transform="translate(494 178)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="40" y="27" font-size="8">a1</text>
  </g>
  <g class="node node-blue" transform="translate(494 238)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <text class="node-title" x="40" y="27" font-size="8">a2</text>
  </g>
  <g class="node node-green" transform="translate(586 178)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="40" y="27" font-size="8">b1</text>
  </g>
  <g class="node node-green" transform="translate(586 238)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#ecfdf5" stroke="#15803d"/>
    <text class="node-title" x="40" y="27" font-size="8">b2</text>
  </g>
  <g class="node node-amber" transform="translate(678 178)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="40" y="27" font-size="8">c1</text>
  </g>
  <g class="node node-amber" transform="translate(678 238)" filter="url(#shadow)">
    <rect width="80" height="48" rx="16" fill="#fff7ed" stroke="#c2410c"/>
    <text class="node-title" x="40" y="27" font-size="8">c2</text>
  </g>
  <g class="node node-plain node-blue" transform="translate(70 302)">
    <text class="node-title" x="155" y="27" font-size="8">rows kept together</text>
  </g>
  <g class="node node-plain node-blue" transform="translate(470 302)">
    <text class="node-title" x="155" y="27" font-size="8">columns stored apart</text>
  </g>
</svg>
